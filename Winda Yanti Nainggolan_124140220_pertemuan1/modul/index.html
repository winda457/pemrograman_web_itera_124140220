<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modul Latihan - Pertemuan 1</title>
  <style>
    body { font-family: Verdana, sans-serif; background: #f4f6fb; color: #222; max-width: 780px; margin: 20px auto; padding: 0 14px; }
    section { background: #fff; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    h2 { font-size: 1rem; margin: 0 0 8px; color: #0f766e; }
    pre { margin: 0; white-space: pre-wrap; font-size: .85rem; }
    input, button { padding: 6px 10px; margin: 2px 2px 2px 0; }
  </style>
</head>
<body>
  <h1>Latihan Pertemuan 1 (Versi C)</h1>

  <div id="keluaran"></div>

  <section>
    <h2>Kalkulator BMI</h2>
    <input type="number" id="inBerat" placeholder="Berat (kg)">
    <input type="number" id="inTinggi" placeholder="Tinggi (cm)">
    <button id="tombolBmi">Hitung</button>
    <p id="outBmi"></p>
  </section>

  <script src="latihan.js"></script>
</body>
</html>
